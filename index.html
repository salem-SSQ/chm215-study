<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CHM 215 Revision</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--fg:#1a1c22;--muted:#5f6677;--line:#d5d9e3;--acc:#2f5bea;--accfg:#fff;--ok:#17803a;--okbg:#e5f5ea;--bad:#c22b2b;--badbg:#fdecec;--sel:#dfe7ff;--lp:#d6336c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111317;--card:#1b1e25;--fg:#e9ebf1;--muted:#9aa2b4;--line:#333846;--acc:#7d9bff;--accfg:#0b0d12;--ok:#5fd583;--okbg:#14301d;--bad:#ff8080;--badbg:#3b1a1a;--sel:#26324f;--lp:#ff6fa3}}
:root[data-theme=dark]{--bg:#111317;--card:#1b1e25;--fg:#e9ebf1;--muted:#9aa2b4;--line:#333846;--acc:#7d9bff;--accfg:#0b0d12;--ok:#5fd583;--okbg:#14301d;--bad:#ff8080;--badbg:#3b1a1a;--sel:#26324f;--lp:#ff6fa3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
header b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:920px;margin:0 auto;padding:16px}
a{color:var(--acc)}
button,.btn{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:10px 16px;cursor:pointer;touch-action:manipulation;text-decoration:none;display:inline-block;text-align:center;vertical-align:middle;-webkit-tap-highlight-color:transparent}
button svg.mol{margin:0 auto}
button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button.on{background:var(--sel);border-color:var(--acc);font-weight:600}
button.ghost{border:none;background:transparent;min-width:48px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.row>button{flex:1 1 auto}
.skiprow{display:flex;justify-content:flex-end;margin:6px 0 0}
.skiprow button{min-width:120px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--fg);text-decoration:none;min-height:96px}
.tile b{display:block;font-size:19px;margin-bottom:4px}
.tile span{color:var(--muted);font-size:15px}
.muted{color:var(--muted)} .small{font-size:14px}
.struct{display:flex;justify-content:center;align-items:center;padding:6px 0;overflow-x:auto}
svg.mol{max-width:100%;height:auto;display:block}
svg.mol text{stroke:none}
svg.mol .lp{fill:var(--lp)} svg.mol .chg{fill:var(--lp)}
input[type=text],input[type=number]{font:inherit;font-size:19px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-height:52px}
.lbl{display:block;font-weight:600;margin:8px 0 6px}
.prompt{font-size:22px;font-weight:700;text-align:center;margin:6px 0 10px}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px}
.fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)}
.fbhead{font-weight:700;font-size:19px}
.fb.ok .fbhead{color:var(--ok)} .fb.bad .fbhead{color:var(--bad)}
.fb p{margin:6px 0}
.why{font-weight:500}
.qtop{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.pill{background:var(--sel);border-radius:99px;padding:2px 10px;font-size:13px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.choices.m1{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.choices.svgopts{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.choices button{min-height:56px;padding:14px 12px}
.choices button.right{background:var(--okbg);border-color:var(--ok)} .choices button.wrong{background:var(--badbg);border-color:var(--bad)}
.rxn{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}
.mol .tapc{fill:transparent;stroke:none;pointer-events:none}
.tapmode .mol .tapc{pointer-events:all;cursor:pointer;fill:var(--acc);fill-opacity:.12;stroke:var(--acc);stroke-width:.035;stroke-dasharray:.08 .07}
.tapmode .mol .tapc.on{fill-opacity:.5;stroke-dasharray:none;stroke-width:.06}
.mol .tapc.good{fill:var(--ok);fill-opacity:.45;stroke:var(--ok);stroke-width:.06;stroke-dasharray:none}
.mol .tapc.bad{fill:var(--bad);fill-opacity:.45;stroke:var(--bad);stroke-width:.06;stroke-dasharray:none}
.tapnote{color:var(--acc)}
.arrow{text-align:center;min-width:150px;font-weight:600;font-size:19px}
.arrow .arr{font-size:30px;line-height:1;transform:scaleX(1.8)}
.qmark{font-size:30px;font-weight:700;color:var(--muted)}
.plus{font-size:30px;font-weight:700}
.fx{font-size:24px;font-weight:700;padding:6px 4px}
.arrow .to{font-size:22px;font-weight:700;padding:0 18px}
.arrow .ast{display:inline-block;vertical-align:middle}
.qline{font-size:18px;font-weight:600;margin:4px 0 8px}
.formula{font-size:34px;font-weight:700;text-align:center;margin:18px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
th{background:var(--bg)}
.tabs button.on{background:var(--acc);color:var(--accfg)}
.flip{perspective:1200px;cursor:pointer;margin:6px 0 10px}
.flipin{position:relative;display:grid;min-height:300px;transition:transform .5s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip.on .flipin{transform:rotateY(180deg)}
.face svg.mol{width:auto;max-height:50vh}
.face{grid-area:1/1;position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .big{font-size:26px;font-weight:700}
.rules h2{margin:4px 0 8px;font-size:20px}
.rules ul{padding-left:20px;margin:6px 0} .rules li{margin:4px 0}
.mini{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.mini>div{text-align:center;font-size:14px;font-weight:600;background:var(--bg);border-radius:12px;padding:6px}
.pass{color:var(--ok);font-weight:700} .fail{color:var(--bad);font-weight:700}
.examhead{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin-bottom:8px}
@media (max-width:560px){main{padding:12px} .formula{font-size:28px}}
</style>

<header><button id="homeBtn" class="ghost" aria-label="Menu">☰</button><b id="ttl">CHM 215</b><span id="score" class="muted small"></span><button id="themeBtn" class="ghost" aria-label="Light/dark">◐</button></header>
<main id="app"></main>
<script>
'use strict';
/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// chemistry formatter: subscripts digits in formulas (CH3, SO3H...) but not S_N1/E2
function fmt(s){return esc(s).replace(/\bpKa\b/g,'pK\u0002').replace(/\bS[Nn]([12])\b/g,'S\u0003$1').replace(/\bE([12])\b/g,'\u0001$1')
 .replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>').replace(/\u0001(\d)/g,'E$1').replace(/\u0003/g,'<sub>N</sub>').replace(/\u0002/g,'<sub>a</sub>');}
const MECH={SN1:'S<sub>N</sub>1',SN2:'S<sub>N</sub>2',E1:'E1',E2:'E2',NR:'N.R.'};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const f2=n=>Math.round(n*1000)/1000;

/* ================= storage ================= */
const SKEY='chm215-revision-v1';
let DB=null;
function loadDB(){try{const s=localStorage.getItem(SKEY);if(s)DB=JSON.parse(s);}catch(e){DB=null}
 const v=DB&&DB.items?(DB.v||1):0;DB=upgradeDB(DB);if(v!==DB.v)saveDB();}
function upgradeDB(db){if(!db||!db.items)return{items:{},modes:{},v:3};
 if((db.v||1)<2){for(const [o,n] of Object.entries(MIGRATE)){const s=db.items[o];if(!s)continue;const t=db.items[n];
  db.items[n]=t?{a:t.a+s.a,c:t.c+s.c,s:Math.min(t.s,s.s),w:t.w+s.w,m:(t.m||s.m)?1:0}:s;delete db.items[o];}db.v=2;}
 // v3: there is no pre-loaded list any more, so un-flag anything that was never actually answered wrong
 if(db.v<3){for(const id in db.items){const s=db.items[id];if(s&&s.m&&!s.w)s.m=0;}db.v=3;}
 return db;}
function saveDB(){try{localStorage.setItem(SKEY,JSON.stringify(DB));}catch(e){}}
const st0=id=>DB.items[id]||{a:0,c:0,s:0,w:0,m:0};
function record(item,ok,mode){const s=DB.items[item.id]||(DB.items[item.id]={a:0,c:0,s:0,w:0,m:0});let msg='';s.a++;
 if(ok){s.c++;s.s++;if(s.m&&s.s>=3){s.m=0;msg='mastered';}}else{s.w++;s.s=0;if(!s.m){s.m=1;msg='added';}}
 for(const k of [mode,'t:'+item.type]){const m=DB.modes[k]||(DB.modes[k]={a:0,c:0});m.a++;if(ok)m.c++;}
 saveDB();return msg;}
const mistakeIds=()=>Object.keys(DB.items).filter(id=>DB.items[id].m&&getItem(id));

/* ================= geometry / ring templates ================= */
const D2R=Math.PI/180,SQ3=Math.sqrt(3),FS=0.42;
const rot=(v,deg)=>{const a=deg*D2R,c=Math.cos(a),s=Math.sin(a);return{x:v.x*c-v.y*s,y:v.x*s+v.y*c};};
const unit=v=>{const l=Math.hypot(v.x,v.y)||1;return{x:v.x/l,y:v.y/l};};
const centroid=p=>{let x=0,y=0;p.forEach(q=>{x+=q.x;y+=q.y});return{x:x/p.length,y:y/p.length};};
function polyPts(n,cx,cy,start){const R=1/(2*Math.sin(Math.PI/n)),o=[];for(let i=0;i<n;i++){const a=(start+i*360/n)*D2R;o.push({x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)});}return o;}
function polyOnEdge(P,Q,n,away){ // regular n-gon built on edge P-Q, on the side away from point "away"
 const M={x:(P.x+Q.x)/2,y:(P.y+Q.y)/2},dx=Q.x-P.x,dy=Q.y-P.y,s=Math.hypot(dx,dy);let nx=-dy/s,ny=dx/s;
 if((away.x-M.x)*nx+(away.y-M.y)*ny>0){nx=-nx;ny=-ny;}
 const h=s/(2*Math.tan(Math.PI/n)),C={x:M.x+nx*h,y:M.y+ny*h},R=s/(2*Math.sin(Math.PI/n));
 const aP=Math.atan2(P.y-C.y,P.x-C.x),aQ=Math.atan2(Q.y-C.y,Q.x-C.x);let st=aQ-aP;while(st>Math.PI)st-=2*Math.PI;while(st<-Math.PI)st+=2*Math.PI;
 const o=[];for(let k=0;k<n;k++){const a=aP+k*st;o.push({x:C.x+R*Math.cos(a),y:C.y+R*Math.sin(a)});}return o;}
// ring vertex numbering: hexagon v0=top, v1=upper-right, v2=lower-right, v3=bottom, v4=lower-left, v5=upper-left
// 5-ring (start 90): v0=bottom (heteroatom), v1=lower-left, v2=upper-left, v3=upper-right, v4=lower-right
const TPL_SPECS={
 benzene:{title:'Benzene',desc:'6-membered ring of carbons.',rings:[{n:6}],dbl:[[0,0,1],[0,2,3],[0,4,5]]},
 pyridine:{title:'Pyridine',desc:'Pyridine is a 6-membered ring with N= (no H).',rings:[{n:6}],dbl:[[0,0,1],[0,2,3],[0,4,5]],atoms:{'0:3':{label:'N',lp:[0]}}},
 pyrrole:{title:'Pyrrole',desc:'Pyrrole is a 5-membered ring with N–H.',rings:[{n:5,start:90}],dbl:[[0,1,2],[0,3,4]],atoms:{'0:0':{label:'N',exo:'H',lp:[62]}}},
 furan:{title:'Furan',desc:'Furan is a 5-membered ring with O.',rings:[{n:5,start:90}],dbl:[[0,1,2],[0,3,4]],atoms:{'0:0':{label:'O',lp:[-58,58]}}},
 thiophene:{title:'Thiophene',desc:'Thiophene is a 5-membered ring with S.',rings:[{n:5,start:90}],dbl:[[0,1,2],[0,3,4]],atoms:{'0:0':{label:'S',lp:[-58,58]}}},
 thiepin:{title:'Thiepin',rings:[{n:7}],dbl:[[0,1,2],[0,3,4],[0,5,6]],atoms:{'0:0':{label:'S',lp:[-58,58]}}},
 dithiin:{title:'1,4-Dithiin',rings:[{n:6}],dbl:[[0,1,2],[0,4,5]],atoms:{'0:0':{label:'S',lp:[-58,58]},'0:3':{label:'S',lp:[-58,58]}}},
 dioxin:{title:'1,4-Dioxin',rings:[{n:6}],dbl:[[0,1,2],[0,4,5]],atoms:{'0:0':{label:'O',lp:[-58,58]},'0:3':{label:'O',lp:[-58,58]}}},
 cyclobutadiene:{title:'Cyclobutadiene',rings:[{n:4,start:-135}],dbl:[[0,0,1],[0,2,3]]},
 cp_anion:{title:'Cyclopentadienyl anion',rings:[{n:5}],dbl:[[0,1,2],[0,3,4]],atoms:{'0:0':{charge:'−',lp:[0]}}},
 cp_cation:{title:'Cyclopentadienyl cation',rings:[{n:5}],dbl:[[0,1,2],[0,3,4]],atoms:{'0:0':{charge:'+'}}},
 cp_radical:{title:'Cyclopentadienyl radical',rings:[{n:5}],dbl:[[0,1,2],[0,3,4]],atoms:{'0:0':{radical:true}}},
 cyclopentadiene:{title:'Cyclopentadiene',rings:[{n:5}],dbl:[[0,1,2],[0,3,4]],atoms:{'0:0':{hh:true}}},
 c3_anion:{title:'Cyclopropenyl anion',rings:[{n:3}],dbl:[[0,1,2]],atoms:{'0:0':{charge:'−',lp:[0]}}},
 c3_cation:{title:'Cyclopropenyl cation',rings:[{n:3}],dbl:[[0,1,2]],atoms:{'0:0':{charge:'+'}}},
 tropylium:{title:'Tropylium (cycloheptatrienyl cation)',rings:[{n:7}],dbl:[[0,1,2],[0,3,4],[0,5,6]],atoms:{'0:0':{charge:'+'}}},
 cycloheptatriene:{title:'Cycloheptatriene',rings:[{n:7}],dbl:[[0,1,2],[0,3,4],[0,5,6]],atoms:{'0:0':{hh:true}}},
 cot:{title:'Cyclooctatetraene',rings:[{n:8,start:-112.5}],dbl:[[0,0,1],[0,2,3],[0,4,5],[0,6,7]]},
 anthracene:{title:'Anthracene',rings:[{n:6},{n:6,cx:SQ3},{n:6,cx:2*SQ3}],dbl:[[0,5,0],[0,3,4],[0,1,2],[1,0,1],[1,2,3],[2,0,1],[2,2,3]]},
 diazaanthracene:{title:'Diaza-anthracene (from your exam)',rings:[{n:6},{n:6,cx:SQ3},{n:6,cx:2*SQ3}],dbl:[[0,5,0],[0,3,4],[0,1,2],[1,0,1],[1,2,3],[2,0,1],[2,2,3]],atoms:{'0:3':{label:'N',lp:[0]},'2:3':{label:'N',lp:[0]}}},
 benzocyclobutadiene:{title:'Benzocyclobutadiene',rings:[{n:6},{n:4,on:[0,1,2]}],dbl:[[0,1,2],[0,3,4],[0,5,0],[1,2,3]]},
 benzocycloheptadiene:{title:'Benzene fused to a 7-ring with a CH₂',rings:[{n:6},{n:7,on:[0,1,2]}],dbl:[[0,1,2],[0,3,4],[0,5,0],[1,3,4],[1,5,6]],atoms:{'1:2':{hh:true}}},
 indole:{title:'Indole',rings:[{n:6},{n:5,on:[0,1,2]}],dbl:[[0,1,2],[0,3,4],[0,5,0],[1,2,3]],atoms:{'1:4':{label:'N',exo:'H',lp:[62]}}},
 nmethylindole:{title:'N-Methylindole',rings:[{n:6},{n:5,on:[0,1,2]}],dbl:[[0,1,2],[0,3,4],[0,5,0],[1,2,3]],atoms:{'1:4':{label:'N',exo:'CH3',lp:[62]}}},
 imidazole:{title:'Imidazole',rings:[{n:5,start:90}],dbl:[[0,1,2],[0,3,4]],atoms:{'0:0':{label:'N',exo:'H',lp:[62]},'0:3':{label:'N',lp:[0]}}},
 borole:{title:'1-Methylborole',rings:[{n:5,start:90}],dbl:[[0,1,2],[0,3,4]],atoms:{'0:0':{label:'B',exo:'CH3'}}},
 quinolinium:{title:'Quinolinium ion (from your exam)',rings:[{n:6},{n:6,cx:SQ3}],dbl:[[0,5,0],[0,3,4],[0,1,2],[1,0,1],[1,2,3]],atoms:{'1:3':{label:'N',exo:'H',charge:'+',chgRot:-60}}},
 cyclohexene:{title:'Cyclohexene',rings:[{n:6}],dbl:[[0,0,1]]},
 cyclohexane:{title:'Cyclohexane',rings:[{n:6}]},
 chd:{title:'1,3-Cyclohexadiene',rings:[{n:6}],dbl:[[0,0,1],[0,2,3]]},
};
const TPL={};
function T(k){return TPL[k]||(TPL[k]=buildTpl(TPL_SPECS[k]));}
function buildTpl(spec){
 const rings=[];
 for(const r of spec.rings){const b=r.on?rings[r.on[0]]:null;
  const pts=b?polyOnEdge(b.pts[r.on[1]],b.pts[r.on[2]],r.n,b.c):polyPts(r.n,r.cx||0,r.cy||0,r.start===undefined?-90:r.start);
  rings.push({pts,c:centroid(pts)});}
 const atoms=[],km={};
 rings.forEach((r,ri)=>{r.ids=r.pts.map((p,vi)=>{let id=atoms.findIndex(a=>Math.hypot(a.x-p.x,a.y-p.y)<0.01);
  if(id<0){id=atoms.length;atoms.push({x:p.x,y:p.y,rings:[]});}atoms[id].rings.push(ri);km[ri+':'+vi]=id;return id;});});
 const bonds=[],bm={},bk=(a,b)=>Math.min(a,b)+'-'+Math.max(a,b);
 rings.forEach(r=>r.ids.forEach((a,i)=>{const b=r.ids[(i+1)%r.ids.length],k=bk(a,b);if(!bm[k]){bm[k]={a,b,o:1};bonds.push(bm[k]);}}));
 (spec.dbl||[]).forEach(([ri,i,j])=>{const b=bm[bk(km[ri+':'+i],km[ri+':'+j])];b.o=2;b.c=rings[ri].c;});
 for(const k in (spec.atoms||{}))Object.assign(atoms[km[k]],spec.atoms[k]);
 atoms.forEach(a=>{const c=centroid(a.rings.map(i=>rings[i].c));a.cx=c.x;a.cy=c.y;});
 const subPos=atoms.map((a,i)=>i).filter(i=>atoms[i].rings.length===1&&!atoms[i].label&&!atoms[i].charge&&!atoms[i].hh&&!atoms[i].radical);
 return {atoms,bonds,rings,subPos,title:spec.title,desc:spec.desc||''};
}

/* ================= substituents & renderer ================= */
const SUBS={
 CH3:{r:'CH3',l:'H3C'},CH2CH3:{r:'CH2CH3',l:'CH3CH2'},'CH(CH3)2':{r:'CH(CH3)2',l:'(CH3)2CH'},
 OH:{r:'OH',l:'HO'},NH2:{r:'NH2',l:'H2N'},OCH3:{r:'OCH3',l:'H3CO'},NO2:{r:'NO2',l:'O2N'},
 F:{r:'F',l:'F'},Cl:{r:'Cl',l:'Cl'},Br:{r:'Br',l:'Br'},I:{r:'I',l:'I'},
 CHO:{draw:'cho',r:'CHO',l:'OHC'},COOH:{r:'CO2H',l:'HO2C'},SO3H:{r:'SO3H',l:'HO3S'},
 'CH=CH2':{draw:'vinyl',r:'CH=CH2',l:'H2C=CH'},CN:{r:'CN',l:'NC'},CH2CHO:{r:'CH2CHO',l:'OHCCH2'},
 SO2Cl:{r:'SO2Cl',l:'ClO2S'},'SO2-':{r:'SO2–',l:'–O2S'},H:{r:'H',l:'H'}
};
function runs(s){const o=[];let prev='';for(const ch of s){const sub=/\d/.test(ch)&&/[A-Za-z\)\d]/.test(prev)&&(o.length&&(o[o.length-1].t==='s'||/[A-Za-z\)]/.test(prev)));
 const t=sub?'s':'n';if(o.length&&o[o.length-1].t===t)o[o.length-1].s+=ch;else o.push({t,s:ch});prev=ch;}return o;}
function chW(ch,t){if(t==='s')return .42;if(/[A-Z]/.test(ch))return .66;if(/[a-z]/.test(ch))return .5;if(/[()]/.test(ch))return .33;if(ch==='=')return .58;return .55;}
const textW=(s,size)=>runs(s).reduce((w,r)=>w+[...r.s].reduce((a,ch)=>a+chW(ch,r.t),0)*size,0);
const firstW=(s,size)=>{const m=s.match(/^[A-Z][a-z]?|^./);return textW(m?m[0]:s,size);};
function tspans(s,size){const d=f2(size*0.25),sm=f2(size*0.72);let out='',inSub=false;
 for(const r of runs(s)){if(r.t==='s'){out+=`<tspan dy="${d}" font-size="${sm}">${esc(r.s)}</tspan>`;inSub=true;}else{out+=inSub?`<tspan dy="-${d}">${esc(r.s)}</tspan>`:esc(r.s);inSub=false;}}
 return out;}
class Draw{
 constructor(){this.el=[];this.b={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};}
 ext(x,y){const b=this.b;b.x0=Math.min(b.x0,x);b.y0=Math.min(b.y0,y);b.x1=Math.max(b.x1,x);b.y1=Math.max(b.y1,y);}
 line(x1,y1,x2,y2){this.el.push(`<line x1="${f2(x1)}" y1="${f2(y1)}" x2="${f2(x2)}" y2="${f2(y2)}"/>`);this.ext(x1,y1);this.ext(x2,y2);}
 text(x,y,s,anchor='middle',size=FS,cls=''){const w=textW(s,size);const x0=anchor==='start'?x:anchor==='end'?x-w:x-w/2;
  this.ext(x0,y-size*.62);this.ext(x0+w,y+size*.62);
  this.el.push(`<text x="${f2(x)}" y="${f2(y+size*.36)}" text-anchor="${anchor}" font-size="${f2(size)}"${cls?` class="${cls}"`:''}>${tspans(s,size)}</text>`);}
 dot(x,y,r,cls=''){this.el.push(`<circle cx="${f2(x)}" cy="${f2(y)}" r="${r}" stroke="none"${cls?` class="${cls}"`:''}/>`);this.ext(x-r,y-r);this.ext(x+r,y+r);}
 bond(P,Q,tp=0,tq=0){const t=unit({x:Q.x-P.x,y:Q.y-P.y});this.line(P.x+t.x*tp,P.y+t.y*tp,Q.x-t.x*tq,Q.y-t.y*tq);}
 inner(P,Q,c,tp,tq){const t=unit({x:Q.x-P.x,y:Q.y-P.y});let n={x:-t.y,y:t.x};const m={x:(P.x+Q.x)/2,y:(P.y+Q.y)/2};
  if((c.x-m.x)*n.x+(c.y-m.y)*n.y<0)n={x:-n.x,y:-n.y};const o=.16,s1=Math.max(.17,tp+.04),s2=Math.max(.17,tq+.04);
  this.line(P.x+n.x*o+t.x*s1,P.y+n.y*o+t.y*s1,Q.x+n.x*o-t.x*s2,Q.y+n.y*o-t.y*s2);}
 dblAcyc(P,Q,tp=0,tq=0){this.bond(P,Q,tp,tq);const t=unit({x:Q.x-P.x,y:Q.y-P.y}),n={x:-t.y,y:t.x},o=.13;
  this.line(P.x+n.x*o+t.x*(tp+.06),P.y+n.y*o+t.y*(tp+.06),Q.x+n.x*o-t.x*(tq+.06),Q.y+n.y*o-t.y*(tq+.06));}
 lpair(a,dir){const p={x:a.x+dir.x*.36,y:a.y+dir.y*.36},n={x:-dir.y,y:dir.x};this.dot(p.x+n.x*.075,p.y+n.y*.075,.045,'lp');this.dot(p.x-n.x*.075,p.y-n.y*.075,.045,'lp');}
 sub(A,d,key,trim){const S=SUBS[key]||{r:key,l:key};const a0={x:A.x+d.x*trim,y:A.y+d.y*trim};
  if(S.draw==='cho'){const C={x:A.x+d.x,y:A.y+d.y};this.line(a0.x,a0.y,C.x,C.y);let dO=rot(d,-60),dH=rot(d,60);
   if(dO.y>dH.y+1e-6||(Math.abs(dO.y-dH.y)<1e-6&&dO.x>dH.x))[dO,dH]=[dH,dO];
   const O={x:C.x+dO.x*.9,y:C.y+dO.y*.9};this.dblAcyc(C,O,0,.28);this.text(O.x,O.y,'O');
   const H={x:C.x+dH.x*.82,y:C.y+dH.y*.82};this.bond(C,H,0,.24);this.text(H.x,H.y,'H');return;}
  if(S.draw==='vinyl'){const B={x:A.x+d.x,y:A.y+d.y};this.line(a0.x,a0.y,B.x,B.y);let dv=rot(d,-60);if(rot(d,60).y<dv.y)dv=rot(d,60);
   const C={x:B.x+dv.x,y:B.y+dv.y};this.dblAcyc(B,C);return;}
  const vertical=Math.abs(d.x)<=.35,lab=(d.x<-.35)?S.l:S.r;
  if(vertical){const e={x:A.x+d.x*.82,y:A.y+d.y*.82};this.line(a0.x,a0.y,e.x,e.y);
   this.text(A.x+d.x*1.12-firstW(lab,FS)/2,A.y+d.y*1.12,lab,'start');}
  else{const e={x:A.x+d.x*.9,y:A.y+d.y*.9};this.line(a0.x,a0.y,e.x,e.y);const tx=A.x+d.x*.98,ty=A.y+d.y*1.0;
   if(d.x>0)this.text(tx-.02,ty,lab,'start');else this.text(tx+.02,ty,lab,'end');}}
 ring(s,opt){const t=T(s.tpl),A=t.atoms;
  t.bonds.forEach(b=>{const P=A[b.a],Q=A[b.b],tp=P.label?.28:0,tq=Q.label?.28:0;this.bond(P,Q,tp,tq);if(b.o===2)this.inner(P,Q,b.c,tp,tq);});
  A.forEach(a=>{const d=unit({x:a.x-a.cx,y:a.y-a.cy});
   if(a.label)this.text(a.x,a.y,a.label);
   if(a.exo)this.sub(a,d,a.exo,a.label?.28:0);
   if(opt.showLP&&a.lp)a.lp.forEach(g=>this.lpair(a,rot(d,g)));
   if(a.charge){const cr=a.chgRot!==undefined,v=rot(d,cr?a.chgRot:(a.lp&&opt.showLP?58:0)),r=(cr||(a.lp&&opt.showLP))?.5:.36;this.text(a.x+v.x*r,a.y+v.y*r,a.charge,'middle',.4,'chg');}
   if(a.radical)this.dot(a.x+d.x*.28,a.y+d.y*.28,.06,'lp');
   if(a.hh)[-38,38].forEach(g=>{const v=rot(d,g);this.line(a.x,a.y,a.x+v.x*.5,a.y+v.y*.5);this.text(a.x+v.x*.74,a.y+v.y*.74,'H','middle',.34);});});
  for(const k in (s.subs||{})){const a=A[+k];if(!a)continue;const d=unit({x:a.x-a.cx,y:a.y-a.cy});this.sub(a,d,s.subs[k],a.label?.28:0);}}
 chain(arr){let x=0;const y=0,n=arr.length;
  arr.forEach((p,i)=>{const first=i===0&&n>1;let lab=p,sp=null;
   if(p==='CH3')lab=first?'H3C':'CH3';else if(p==='CH2CH3')lab=first?'CH3CH2':'CH2CH3';else if(p==='CF3')lab=first?'F3C':'CF3';
   else if(p==='NMe2')lab=first?'(CH3)2N':'N(CH3)2';else if(p==='SO2'||p==='SO'){lab='S';sp=p;}else if(p==='CO'){lab='C';sp='CO';}else if(p==='bond')lab=null;
   if(i>0){this.line(x+.07,y,x+.55,y);x+=.62;}
   if(lab===null)return;
   const w=textW(lab,FS);this.text(x,y,lab,'start');
   if(sp){const cx=x+w/2;[[-1]].concat(sp==='SO2'?[[1]]:[]).forEach(([sg])=>{this.line(cx-.06,y+sg*.3,cx-.06,y+sg*.88);this.line(cx+.06,y+sg*.3,cx+.06,y+sg*.88);this.text(cx,y+sg*1.12,'O');});}
   x+=w;});}
 taps(m){const r=.36;m.a.forEach((a,i)=>{if(a[2])return;this.el.push(`<circle class="tapc" data-a="${i}" cx="${f2(a[0])}" cy="${f2(a[1])}" r="${r}"/>`);this.ext(a[0]-r,a[1]-r);this.ext(a[0]+r,a[1]+r);});}
 mol(m){const at=m.a.map(a=>({x:a[0],y:a[1],label:a[2]}));
  m.b.forEach(([a,b,o])=>{const P=at[a],Q=at[b],tp=P.label?.3:0,tq=Q.label?.3:0;if(o===2)this.dblAcyc(P,Q,tp,tq);else this.bond(P,Q,tp,tq);});
  at.forEach(a=>{if(a.label)this.text(a.x,a.y,a.label);});}
 svg(scale=46,view=null,extra=''){const pad=.22;let x0,y0,w,h;
  if(view)[x0,y0,w,h]=view;else{x0=this.b.x0-pad;y0=this.b.y0-pad;w=this.b.x1-this.b.x0+2*pad;h=this.b.y1-this.b.y0+2*pad;}
  return `<svg class="mol" xmlns="http://www.w3.org/2000/svg" viewBox="${f2(x0)} ${f2(y0)} ${f2(w)} ${f2(h)}" width="${Math.round(w*scale)}" height="${Math.round(h*scale)}" stroke="currentColor" stroke-width="0.055" stroke-linecap="round" fill="currentColor" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="600">${this.el.join('')}${extra}</svg>`;}
}

// Substitution of the C=C each beta would give = carbons on alpha (other than beta) + carbons on beta (other than alpha).
// Zaitsev = the beta(s) giving the MOST substituted alkene, Hofmann = the LEAST substituted.
const CHN=['C','CH','CH2','CH3'];
function elimSites(sk){const s=SUBSTR[sk];if(!s||!s.st||!s.st.mol||!['1','2','3'].includes(s.deg))return null;
 const m=MOLS[s.st.mol],n=m.a.length,adj=[...Array(n)].map(()=>[]);m.b.forEach(([a,b,o])=>{adj[a].push([b,o||1]);adj[b].push([a,o||1]);});
 const isC=i=>!m.a[i][2],H=i=>4-adj[i].reduce((t,[,o])=>t+o,0),x=m.a.findIndex(a=>/^(Br|Cl|I)$/.test(a[2]||''));if(x<0)return null;
 const al=adj[x][0][0],cN=(i,ex)=>adj[i].filter(([j])=>j!==ex&&isC(j)).length;
 const betas=adj[al].map(([j])=>j).filter(j=>isC(j)&&H(j)>0).map(j=>({i:j,sub:cN(al,j)+cN(j,al)}));if(!betas.length)return null;
 const mx=Math.max(...betas.map(b=>b.sub)),mn=Math.min(...betas.map(b=>b.sub));
 return{alpha:al,hal:m.a[x][2],betas,H,z:betas.filter(b=>b.sub===mx).map(b=>b.i),h:betas.filter(b=>b.sub===mn).map(b=>b.i)};}
function goodSites(sk,rk){const a=rxnAnswer(sk,rk),es=elimSites(sk);if(!es||(a.m!=='E1'&&a.m!=='E2'))return{es,good:[],sl:'',rule:''};

function elimTxt(sk,rk){const a=rxnAnswer(sk,rk),g=goodSites(sk,rk);if(g.good.length)return ` (${g.rule}: H off the ${g.sl})`;
 return a.m==='E2'?(a.e==='Z'?' (Zaitsev)':' (Hofmann)'):'';}

 if(s.deg==='aryl'||s.deg==='vinyl')return{m:'NR'};

const MORPHS=('methyl ethyl propyl isopropyl butyl methoxy ethoxy hydroxy amino nitro fluoro chloro bromo iodo formyl methanoyl ethanoyl formylmethyl oxoethyl methylformyl '+
 'carboxy sulfo vinyl ethenyl cyano phenyl benzyl acetyl nitrile di tri tetra penta benzene toluene xylene phenol aniline anisole benzaldehyde benzoic benzenesulfonic '+
 'benzenesulfonyl sulfonic styrene pyridine pyrrole furan thiophene anthracene benzonitrile cumene acid chloride bromide sulfonyl methanesulfonyl toluenesulfonyl '+
 'trifluoromethanesulfonyl trifluoromethanesulfonate mesyl tosyl triflyl mesylate tosylate triflate methanesulfonate picric anisic methane ethene '+
 'ether benzenamine tnt tscl mscl trifyl').split(' ');
const MSORT=[...MORPHS].sort((a,b)=>b.length-a.length);
const EXACT=new Set(['di','tri','tetra','penta','tnt','tscl','mscl']);
const PARENTS=new Set(['benzene','toluene','xylene','phenol','aniline','anisole','benzaldehyde','benzoic','benzenesulfonic','styrene','pyridine','pyrrole','furan','thiophene','anthracene','benzonitrile','cumene','benzenamine']);

const allow=m=>EXACT.has(m)||m.length<=3?0:m.length<=6?1:m.length<=13?2:3;
// pairs that must never be fuzzy-matched into each other (a tie counts as wrong)
const CONFUSE=[['methyl','ethyl'],['chloro','bromo'],['nitro','nitrile'],['benzyl','benzene'],['benzyl','benzoic'],['benzene','benzoic'],['toluene','xylene'],['phenol','phenyl'],['pyrrole','pyridine'],['furan','thiophene'],['propyl','isopropyl']];
const partners=w=>CONFUSE.filter(p=>p.includes(w)).map(p=>p[0]===w?p[1]:p[0]);
function dl(a,b){const n=a.length,m=b.length;if(!n)return m;if(!m)return n;const d=[];for(let i=0;i<=n;i++){d.push(new Array(m+1).fill(0));d[i][0]=i;}for(let j=0;j<=m;j++)d[0][j]=j;

  if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);}return d[n][m];}
function segExact(s,i=0){if(i===s.length)return [];for(const w of MSORT){if(s.startsWith(w,i)){const r=segExact(s,i+w.length);if(r)return [w,...r];}}return null;}
// split a name into locants, o/m/p and letter chunks (spaces, hyphens, commas, brackets ignored inside chunks)
function tokenize(s){
 s=String(s).toLowerCase().replace(/[‐-―−]/g,'-').replace(/['’`´]/g,'');
 const toks=[];let i=0,word='',prevL=false;const flush=()=>{if(word){toks.push({t:'w',v:word});word='';}};
 while(i<s.length){const rest=s.slice(i);let m;
  if((m=rest.match(/^\d+(?:\s*[,.]\s*\d+|\s+\d+)*/))){flush();toks.push({t:'loc',v:m[0].split(/[\s,.]+/).join(',')});i+=m[0].length;prevL=false;continue;}
  if(!prevL){
   if((m=rest.match(/^n\s*,\s*n(?=[\s-])/))){flush();toks.push({t:'loc',v:'n,n'});i+=m[0].length;continue;}
   if((m=rest.match(/^(ortho|meta|para)(?![a-z]*?yl\b)/))||(m=rest.match(/^([omp])(?=\s*-|\s+[a-z])/))){flush();toks.push({t:'omp',v:m[1][0]});i+=m[0].length;continue;}
  }
  const ch=s[i];
  if(/[a-z]/.test(ch)){word+=ch;prevL=true;}else prevL=false;
  i++;}
 flush();return toks;}
function variants(n){const out=[n];let m;
 if((m=n.match(/^([omp])-([a-z].*)$/i))&&!/\d/.test(m[2])&&!/xylene/i.test(m[2]))out.push({o:'2',m:'3',p:'4'}[m[1].toLowerCase()]+'-'+m[2]);
 if((m=n.match(/^([234])-([a-z].*)$/i))&&!/\d/.test(m[2]))out.push({2:'o',3:'m',4:'p'}[m[1]]+'-'+m[2]);return out;}
function prepNames(names){const all=[];names.forEach(n=>variants(n).forEach(v=>{if(all.some(a=>a.display.toLowerCase()===v.toLowerCase()))return;

// align a typed chunk to the answer's morphemes; ≤1 typo per short word, ≤2 per long word; reject if closer to a different real word
function matchChunk(inp,morphs){const n=inp.length,m=morphs.length,INF=1e9;
 const dp=Array.from({length:m+1},()=>new Array(n+1).fill(INF)),bk=Array.from({length:m+1},()=>new Array(n+1).fill(-1));dp[0][0]=0;
 for(let j=1;j<=m;j++){const w=morphs[j-1],al=allow(w),L=w.length;
  for(let i=1;i<=n;i++)for(let k=Math.max(0,i-L-al);k<=i-Math.max(1,L-al);k++){if(dp[j-1][k]>=INF)continue;const d=dl(inp.slice(k,i),w);if(d>al)continue;const v=dp[j-1][k]+d;if(v<dp[j][i]){dp[j][i]=v;bk[j][i]=k;}}}
 if(dp[m][n]>=INF)return{ok:false};
 const segs=[];let i=n;for(let j=m;j>0;j--){const k=bk[j][i];segs.unshift(inp.slice(k,i));i=k;}
 for(let j=0;j<m;j++){const s=segs[j],w=morphs[j],d=dl(s,w);if(!d)continue;const pw=partners(w);for(const o of MORPHS){if(o===w)continue;const od=dl(s,o);if(od<d||(od===d&&pw.includes(o)))return{ok:false,confused:{seg:s,as:o,want:w}};}}

function checkName(input,item){const it=tokenize(input||'');if(!it.length)return{ok:false,reasons:['Type a name first.']};let best=null;
 for(const nm of item.allNames){const at=nm.toks;if(at.length!==it.length)continue;let ok=true,dist=0;
  for(let k=0;k<at.length&&ok;k++){const a=at[k],b=it[k];if(a.t!==b.t){ok=false;break;}
   if(a.t==='w'){if(!a.morphs){if(a.v!==b.v)ok=false;continue;}if(b.v!==a.v&&segExact(b.v)){ok=false;break;}/* typed real (different) words: never fuzzy */const r=matchChunk(b.v,a.morphs);if(!r.ok)ok=false;else dist+=r.dist;}
   else if(a.v!==b.v)ok=false;}
  if(ok&&(!best||dist<best.dist||(dist===best.dist&&nm.key&&!best.nm.key)))best={nm,dist};}

function diagnose(input,item){

 const swap=(x,y,msg)=>{if((has(im,x)&&has(am,y)&&!has(am,x))||(has(im,y)&&has(am,x)&&!has(am,y)))R.push(msg);};
 if(has(im,'benzyl')&&am.some(w=>w.startsWith('benzen')))R.push('benzyl (C6H5CH2–) ≠ benzene (the ring itself).');
 swap('toluene','xylene','toluene = 1 CH3 on benzene; xylene = 2 CH3.');
 swap('phenyl','phenol','phenol = C6H5–OH (a parent); phenyl = C6H5– (a substituent).');
 swap('styrene','benzaldehyde','CHO on the ring (C=O + H) = benzaldehyde; styrene = CH=CH2 (a C=C).');
 swap('pyrrole','pyridine','pyrrole = 5-ring with N–H; pyridine = 6-ring with N=.');
 swap('furan','thiophene','furan has O; thiophene has S.');
 swap('methyl','ethyl','methyl = CH3 (1 C); ethyl = CH2CH3 (2 C).');
 swap('chloro','bromo','chloro = Cl; bromo = Br.');
 swap('propyl','isopropyl','isopropyl = CH(CH3)2 (branched); propyl = CH2CH2CH3.');
 swap('nitro','nitrile','nitro = NO2; nitrile = C≡N.');
 swap('benzoic','benzene','benzoic acid = ring + COOH; benzene = the ring alone.');
 for(let k=0;k+1<it.length;k++)if(it[k].t==='loc'&&it[k+1].t==='w'){const s=segExact(it[k+1].v);if(s&&PARENTS.has(s[0])){R.push(`Don't write the parent's number (not “${it[k].v}-${s[0]}”): the parent group is automatically C-1.`);break;}}

 app.innerHTML=`<div class="rules">
 <div class="card"><h2>o / m / p positions</h2><div class="mini">${mini(C.oxylene.st,'ortho (o) = 1,2')}${mini(C.mxylene.st,'meta (m) = 1,3')}${mini(C.pxylene.st,'para (p) = 1,4')}</div>

 <div class="card"><h2>Naming rules</h2><ul>
 <li><b>One parent only.</b> The highest-priority group is the parent and is C-1: <b>COOH > SO<sub>3</sub>H > CHO > OH > NH<sub>2</sub> > OCH<sub>3</sub> > CH<sub>3</sub></b>. NO<sub>2</sub>, F, Cl, Br, I and other alkyls are always prefixes.</li>
 <li>The parent group is C-1. <b>Don’t write its number</b>: “2-nitrophenol”, not “2-nitro-1-phenol”.</li>
 <li>Number around the ring to give the <b>lowest numbers</b>.</li>
 <li>Prefixes in <b>alphabetical order</b> (ignore di-/tri-): bromo, chloro, ethyl, formyl, isopropyl, methoxy, methyl, nitro.</li>
 <li>o-/m-/p- only when there are 2 groups on the ring.</li>
 <li>Examples: 5-chloro-2-nitroanisole · 3,5-dibromoaniline · m-formylbenzenesulfonic acid · 2,4,6-trinitrotoluene (TNT) · 2,4,6-trinitrophenol (picric acid) · p-methylanisole (not “p-anisole toluene”).</li>

 <p class="small">Pyridine = 6-ring, N= (no H). Pyrrole = 5-ring, N–H. Furan = O. Thiophene = S.</p></div>

 <li>-ate = the ester/anion: ethyl mesylate = CH<sub>3</sub>SO<sub>2</sub>–<b>O</b>–CH<sub>2</sub>CH<sub>3</sub>. Mesylate, tosylate and triflate are excellent leaving groups.</li>
 <li>R–OH can’t do S<sub>N</sub>2 (OH⁻ is a bad leaving group): make R–OTf / OMs / OTs first, then NaCN etc.</li>
</ul></div>
 <div class="card"><h2>Hückel’s rule</h2><ul><li>Aromatic needs: <b>cyclic, planar, fully conjugated</b> + <b>4n+2 π e⁻</b> (2, 6, 10, 14).</li>
 <li><b>4n</b> (4, 8) → <b>anti-aromatic</b> (e.g. thiepin, 1,4-dithiin: 8 π).</li>
 <li><b>Non-aromatic</b> only when the ring has an <b>sp³ CH<sub>2</sub></b> or isn’t cyclic / fully conjugated, or the count is odd (5 π radical).</li>
 <li>Professor’s rule: <b>just count π electrons</b>. Don’t call a ring non-aromatic because the real molecule puckers.</li>
 <li>Counting: each C=C or C=N = 2. O / S / N–H with no double bond: ONE lone pair counts (2). C⁻ = 2. C⁺ or B = 0 (empty p).</li>
 <li><b>Pyridine-type N</b> (already in a C=N): its lone pair does NOT count.</li></ul></div>
 <div class="card"><h2>Ch 6: professor’s table</h2><div style="overflow-x:auto"><table><tr><th></th><th>Methyl</th><th>1°</th><th>2°</th><th>3°</th></tr>
 <tr><th>Weak base (I⁻, Br⁻, CN⁻, RS⁻, RCO<sub>2</sub>⁻, N<sub>3</sub>⁻)</th><td>S<sub>N</sub>2</td><td>S<sub>N</sub>2</td><td>S<sub>N</sub>2</td><td>N.R.</td></tr>
 <tr><th>Strong base (OH⁻, RO⁻ like CH<sub>3</sub>ONa / C<sub>2</sub>H<sub>5</sub>ONa, NH<sub>2</sub>⁻)</th><td>S<sub>N</sub>2</td><td>S<sub>N</sub>2</td><td>E2</td><td>E2</td></tr>
 <tr><th>Bulky base ((CH<sub>3</sub>)<sub>3</sub>COK)</th><td>S<sub>N</sub>2</td><td>E2</td><td>E2</td><td>E2</td></tr>
 <tr><th>Solvent only (H<sub>2</sub>O, CH<sub>3</sub>OH)</th><td>—</td><td>—</td><td>—</td><td>S<sub>N</sub>1 (25 °C) / E1 (heat)</td></tr></table></div>
 <ul><li>Phenyl and vinyl halides (C–X on sp² carbon) → <b>N.R.</b></li>
 <li>E2 with a small strong base → <b>Zaitsev</b> (more substituted alkene). Bulky base → <b>Hofmann</b> (less substituted).</li>
 <li>Strong or weak base? Look at the conjugate acid: <b>pK<sub>a</sub> ≥ ~15.7 (water) → strong base</b> (CH<sub>3</sub>ONa, C<sub>2</sub>H<sub>5</sub>ONa, NaOH, NaNH<sub>2</sub>, NaH, (CH<sub>3</sub>)<sub>3</sub>COK). Weak base, good nucleophile: CH<sub>3</sub>CO<sub>2</sub>Na (4.8), CH<sub>3</sub>SNa (10.4), NaCN (9.2), NaN<sub>3</sub>, NaI.</li>

 <li>Nucleophiles: CH<sub>3</sub>S⁻ > HS⁻ > CH<sub>3</sub>SH > CH<sub>3</sub>SH<sub>2</sub>⁺ (S is the strongest). Aprotic (no O–H / N–H): CH<sub>3</sub>CN, THF, CH<sub>3</sub>CH<sub>2</sub>OCH<sub>2</sub>CH<sub>3</sub>. Protic: H<sub>2</sub>O, CH<sub>3</sub>OH, CH<sub>3</sub>CH<sub>2</sub>OH, CH<sub>3</sub>CH<sub>2</sub>NHCH<sub>2</sub>CH<sub>3</sub>.</li></ul></div>
 <div class="card"><h2>Conversions, ethers &amp; Diels–Alder</h2><ul>
 <li>Phenol + NaOH works (pK<sub>a</sub> 9.9 < 15.7). Cyclohexanol needs NaH / Na / NaNH<sub>2</sub> (NaOH is too weak).</li>
 <li>Then S<sub>N</sub>2 with a 1° R–Br (e.g. benzyl bromide, CH<sub>3</sub>CH<sub>2</sub>Br). It is <b>not</b> a Gilman reaction. S<sub>N</sub>2 never happens on a benzene carbon.</li>
 <li>R–OH → R–Nu: OH⁻ is a bad leaving group, so first MsCl / TsCl / CF<sub>3</sub>SO<sub>2</sub>Cl (→ R–OMs / OTs / OTf), then the nucleophile (CH<sub>3</sub>SNa, NaCN…).</li>
 <li>Epoxide + RS⁻ (then H<sub>2</sub>O): S<sub>N</sub>2 opens the ring → RS–CH<sub>2</sub>CH<sub>2</sub>–OH. New C–C bond (R–X → R–R′): Gilman reagent R<sub>2</sub>CuLi.</li>
 <li>3° halide → C=CH<sub>2</sub> outside the ring (less substituted): bulky (CH<sub>3</sub>)<sub>3</sub>COK (Hofmann).</li>
 <li>S<sub>N</sub>1 of (CH<sub>3</sub>)<sub>3</sub>CBr in H<sub>2</sub>O: carbocation, then oxonium ion. On slide 23 the oxonium ion is the lowest-energy (most stable) intermediate.</li>
 <li>Diels–Alder: diene + dienophile → cyclohexene. Butadiene + CH<sub>2</sub>=CH–OCH<sub>3</sub> → <b>4-methoxycyclohexene</b> (the substituent is 2 carbons from the new C=C, never next to it).</li></ul></div>
 </div>`;}
